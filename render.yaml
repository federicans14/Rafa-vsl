# Blueprint de Render — Rafa Coaching · Landing VSL
#
# Región frankfurt: la base de Turso va en aws-eu-west-1 (Irlanda) y el público
# es español. Oregón, que es el valor por defecto, metería un viaje transatlántico
# en cada consulta.
#
# Los servicios se llaman `rafa-vsl-*` para no confundirlos con los de la otra
# landing (`rafa-coaching-*`) ni con la web (`entrenaconrafa-web`).

services:
  # --- Backend: API de leads + panel ----------------------------------------
  - name: rafa-vsl-api
    type: web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: ./backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Hace que la cookie de sesión salga `secure` + `sameSite=none`. Es
      # obligatorio porque frontend y backend están en dominios distintos, y es
      # el fallo más repetido de este tipo de proyecto.
      - key: NODE_ENV
        value: production

      # Base PROPIA de esta landing. Nunca la de plan.entrenaconrafa.com.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # Se genera solo, y es mejor que reutilizar el de local.
      - key: JWT_SECRET
        generateValue: true

      # El dominio del frontend. No se sabe hasta que Render cree el sitio, así
      # que se rellena en la segunda vuelta.
      - key: CORS_ORIGIN
        sync: false

      # Green API: la MISMA instancia y el MISMO grupo que la otra landing
      # (decidido el 25/08). Se distinguen por el emoji del aviso y por el
      # utm_campaign con el nombre del anuncio.
      - key: GREEN_API_URL
        value: https://api.green-api.com
      - key: GREEN_API_INSTANCE_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: GREEN_API_CHAT_ID
        sync: false

      # El admin se siembra solo la primera vez que arranca contra una base vacía.
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ADMIN_SEED_NAME
        value: Rafa

  # --- Frontend: la landing VSL ---------------------------------------------
  - name: rafa-vsl-web
    type: web
    runtime: static
    # Sin `plan`: los sitios estáticos de Render no tienen planes y el campo hace
    # fallar el blueprint entero con "no such plan free for service type web".
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # OJO: Vite incrusta estas variables DURANTE el build. Cambiarlas no basta,
      # hay que relanzar el despliegue o la web publicada conserva el valor viejo
      # y los leads no se guardan sin dar ningún error.
      - key: VITE_API_URL
        sync: false
      - key: VITE_FB_PIXEL_ID
        sync: false
      - key: VITE_FB_DOMAIN_VERIFICATION
        sync: false
    routes:
      # SPA con react-router: sin esto, entrar directo a /admin o recargar da 404.
      - type: rewrite
        source: /*
        destination: /index.html
