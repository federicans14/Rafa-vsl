# Blueprint de Render — Rafa Coaching · Landing VSL
#
# Región frankfurt: la base de Turso va en aws-eu-west-1 (Irlanda) y el público
# es español. Oregón, que es el valor por defecto, metería un viaje transatlántico
# en cada consulta.
#
# Los servicios se llaman `rafa-vsl-*` para no confundirlos con los de la otra
# landing (`rafa-coaching-*`) ni con la web (`entrenaconrafa-web`).

services:
  # --- Backend: API de leads + panel ----------------------------------------
  - name: rafa-vsl-api
    type: web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: ./backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Hace que la cookie de sesión salga `secure` + `sameSite=none`. Es
      # obligatorio porque frontend y backend están en dominios distintos, y es
      # el fallo más repetido de este tipo de proyecto.
      - key: NODE_ENV
        value: production

      # Base PROPIA de esta landing. Nunca la de plan.entrenaconrafa.com.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # Se genera solo, y es mejor que reutilizar el de local.
      - key: JWT_SECRET
        generateValue: true

      # El dominio del frontend. No se sabe hasta que Render cree el sitio, así
      # que se rellena en la segunda vuelta.
      - key: CORS_ORIGIN
        sync: false

      # Green API: la MISMA instancia y el MISMO grupo que la otra landing
      # (decidido el 25/08). Se distinguen por el emoji del aviso y por el
      # utm_campaign con el nombre del anuncio.
      - key: GREEN_API_URL
        value: https://api.green-api.com
      - key: GREEN_API_INSTANCE_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: GREEN_API_CHAT_ID
        sync: false

      # El admin se siembra solo la primera vez que arranca contra una base vacía.
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ADMIN_SEED_NAME
        value: Rafa

  # --- Frontend ---------------------------------------------------------------
  #
  # La landing NO va aqui: vive en Netlify (ver netlify.toml en la raiz).
  #
  # Motivo: Render cobra los dominios propios pasado el cupo del plan, y ese cupo
  # ya lo gastan las otras propiedades de Rafa. Netlify los da ilimitados y
  # gratis, y esta landing es un sitio estatico que no necesita nada mas.
  #
  # Si algun dia se quiere volver a traer, el bloque estaba aqui: `type: web`,
  # `runtime: static`, rootDir ./frontend, build `npm ci && npm run build`,
  # staticPublishPath ./dist, y una regla de rewrite /* -> /index.html.
  # OJO: sin `plan`, que los sitios estaticos de Render no tienen y hace fallar
  # el blueprint entero.
